<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сообщения — Clash Nexus</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  .dm-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: 72vh; }
  @media (max-width: 800px) { .dm-layout { grid-template-columns: 1fr; height: auto; } }
  .dm-search { margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-root" class="sidebar"></aside>
  <div class="app-main">
    <div id="topbar-root"></div>

    <main class="page">
      <div class="page__head"><div><h1>Личные сообщения</h1><p>Переписки с другими игроками</p></div></div>
      <div id="loading" class="empty-state">Загрузка…</div>

      <div id="dm-content" style="display:none;">
        <div class="dm-layout">
          <div>
            <input class="dm-search" id="player-search" placeholder="Найти игрока по имени…">
            <div id="search-results"></div>
            <div class="conv-list" id="conv-list"></div>
          </div>
          <div class="chat-shell" id="chat-shell" style="display:none;">
            <div class="chat-shell__head">
              <img id="peer-avatar" style="width:34px;height:34px;border-radius:50%;object-fit:cover;" src="">
              <h3 id="peer-name" style="margin:0;"></h3>
            </div>
            <div class="chat-log" id="dm-log"></div>
            <form class="chat-shell__composer" id="dm-composer">
              <input id="dm-input" placeholder="Написать сообщение…" autocomplete="off">
              <button class="btn btn--ember" type="submit">Отправить</button>
            </form>
          </div>
          <div class="empty-state" id="no-chat"><h3>Выбери собеседника</h3><p>Найди игрока сверху или выбери из списка переписок.</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
  mountShell("messages.html");
  let profile = null;
  let peer = null;
  let channel = null;

  async function init() {
    profile = await requireAuth();
    if (!profile) return;
    document.getElementById("loading").style.display = "none";
    document.getElementById("dm-content").style.display = "block";
    loadConversations();

    const peerId = new URLSearchParams(location.search).get("to");
    if (peerId) openConversation(peerId);
  }

  async function loadConversations() {
    const { data } = await sb
      .from("direct_messages")
      .select("*")
      .or(`sender_id.eq.${profile.id},receiver_id.eq.${profile.id}`)
      .order("created_at", { ascending: false });

    const peers = new Map();
    (data || []).forEach((m) => {
      const otherId = m.sender_id === profile.id ? m.receiver_id : m.sender_id;
      if (!peers.has(otherId)) peers.set(otherId, m);
    });

    const host = document.getElementById("conv-list");
    if (!peers.size) { host.innerHTML = `<div class="empty-state">Переписок пока нет</div>`; return; }

    const ids = [...peers.keys()];
    const { data: profiles } = await sb.from("profiles").select("id, username, avatar_url").in("id", ids);
    const pMap = new Map((profiles || []).map((p) => [p.id, p]));

    host.innerHTML = ids
      .map((id) => {
        const p = pMap.get(id) || { username: "Игрок" };
        const last = peers.get(id);
        return `
        <div class="conv-row" data-peer="${id}">
          <img src="${p.avatar_url || defaultAvatar(p.username)}" alt="">
          <div>
            <div>${escapeHtml(p.username)}</div>
            <div class="last">${escapeHtml((last.content || "").slice(0, 40))}</div>
          </div>
        </div>`;
      })
      .join("");

    host.querySelectorAll("[data-peer]").forEach((row) =>
      row.addEventListener("click", () => openConversation(row.dataset.peer))
    );
  }

  document.getElementById("player-search").addEventListener("input", async (e) => {
    const q = e.target.value.trim();
    const host = document.getElementById("search-results");
    if (q.length < 2) { host.innerHTML = ""; return; }
    const { data } = await sb.from("profiles").select("id, username, avatar_url").ilike("username", `%${q}%`).neq("id", profile.id).limit(6);
    host.innerHTML = (data || [])
      .map(
        (p) => `<div class="conv-row" data-peer="${p.id}"><img src="${p.avatar_url || defaultAvatar(p.username)}"><div>${escapeHtml(p.username)}</div></div>`
      )
      .join("");
    host.querySelectorAll("[data-peer]").forEach((row) => row.addEventListener("click", () => openConversation(row.dataset.peer)));
  });

  async function openConversation(peerId) {
    const { data: p } = await sb.from("profiles").select("*").eq("id", peerId).single();
    if (!p) return;
    peer = p;
    document.getElementById("no-chat").style.display = "none";
    document.getElementById("chat-shell").style.display = "flex";
    document.getElementById("peer-avatar").src = p.avatar_url || defaultAvatar(p.username);
    document.getElementById("peer-name").textContent = p.username;

    document.querySelectorAll(".conv-row").forEach((r) => r.classList.toggle("is-active", r.dataset.peer === peerId));

    const { data: msgs } = await sb
      .from("direct_messages")
      .select("*")
      .or(`and(sender_id.eq.${profile.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${profile.id})`)
      .order("created_at", { ascending: true });

    const log = document.getElementById("dm-log");
    log.innerHTML = (msgs || []).map(renderDm).join("");
    log.scrollTop = log.scrollHeight;

    if (channel) sb.removeChannel(channel);
    channel = sb
      .channel(`dm-${[profile.id, peerId].sort().join("-")}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "direct_messages" }, (payload) => {
        const m = payload.new;
        const belongs = (m.sender_id === profile.id && m.receiver_id === peerId) || (m.sender_id === peerId && m.receiver_id === profile.id);
        if (!belongs) return;
        log.insertAdjacentHTML("beforeend", renderDm(m));
        log.scrollTop = log.scrollHeight;
        if (m.sender_id === peerId) loadConversations();
      })
      .subscribe();
  }

  function renderDm(m) {
    const mine = m.sender_id === profile.id;
    const p = mine ? profile : peer;
    return `
      <div class="msg ${mine ? "msg--mine" : ""}">
        <img src="${p?.avatar_url || defaultAvatar(p?.username)}" alt="">
        <div>
          <div class="meta"><span>${fmtTime(m.created_at)}</span></div>
          <div class="bubble">${escapeHtml(m.content)}</div>
        </div>
      </div>`;
  }

  document.getElementById("dm-composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!peer) return;
    const input = document.getElementById("dm-input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";
    const { error } = await sb.from("direct_messages").insert({ sender_id: profile.id, receiver_id: peer.id, content });
    if (error) toast(error.message, "error");
    else loadConversations();
  });

  init();
</script>
</body>
</html>
