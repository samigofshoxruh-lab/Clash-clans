<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сообщения — Clash Nexus</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  .dm-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: 72vh; }
  @media (max-width: 800px) { .dm-layout { grid-template-columns: 1fr; height: auto; } }
  .dm-search { margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-root" class="sidebar"></aside>
  <div class="app-main">
    <div id="topbar-root"></div>

    <main class="page">
      <div class="page__head"><div><h1>Личные сообщения</h1><p>Переписки с другими игроками</p></div></div>
      <div id="loading" class="empty-state">Загрузка…</div>

      <div id="dm-content" style="display:none;">
        <div class="dm-layout">
          <div>
            <input class="dm-search" id="player-search" placeholder="Найти игрока по имени…">
            <div id="search-results"></div>
            <div class="conv-list" id="conv-list"></div>
          </div>
          <div class="chat-shell" id="chat-shell" style="display:none;">
            <div class="chat-shell__head">
              <img id="peer-avatar" style="width:34px;height:34px;border-radius:50%;object-fit:cover;" src="">
              <h3 id="peer-name" style="margin:0;"></h3>
            </div>
            <div class="chat-log" id="dm-log"></div>
            <form class="chat-shell__composer" id="dm-composer">
              <input id="dm-input" placeholder="Написать сообщение…" autocomplete="off">
              <button class="btn btn--ember" type="submit">Отправить</button>
            </form>
          </div>
          <div class="empty-state" id="no-chat"><h3>Выбери собеседника</h3><p>Найди игрока сверху или выбери из списка переписок.</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
  mountShell("messages.html");
  let profile = null;
  let peer = null;
  let myClan = null;
  let mode = "dm"; // "dm" | "clan"
  let channel = null;
  let pollTimer = null;
  let seenIds = new Set();

  async function init() {
    profile = await requireAuth();
    if (!profile) return;
    document.getElementById("loading").style.display = "none";
    document.getElementById("dm-content").style.display = "block";

    if (profile.clan_id) {
      const { data: clan } = await sb.from("clans").select("id, name, badge_url, tag").eq("id", profile.clan_id).maybeSingle();
      myClan = clan || null;
    }

    await loadConversations();

    const peerId = new URLSearchParams(location.search).get("to");
    if (peerId) openConversation(peerId);
    else if (myClan) openClanChat();
  }

  async function loadConversations() {
    const { data } = await sb
      .from("direct_messages")
      .select("*")
      .or(`sender_id.eq.${profile.id},receiver_id.eq.${profile.id}`)
      .order("created_at", { ascending: false });

    const peers = new Map();
    (data || []).forEach((m) => {
      const otherId = m.sender_id === profile.id ? m.receiver_id : m.sender_id;
      if (!peers.has(otherId)) peers.set(otherId, m);
    });

    const host = document.getElementById("conv-list");
    const ids = [...peers.keys()];
    const { data: profiles } = ids.length
      ? await sb.from("profiles").select("id, username, avatar_url").in("id", ids)
      : { data: [] };
    const pMap = new Map((profiles || []).map((p) => [p.id, p]));

    const clanRowHtml = myClan
      ? `<div class="conv-row conv-row--clan" data-clan="1">
          <img src="${myClan.badge_url || defaultAvatar(myClan.tag)}" alt="">
          <div>
            <div>${escapeHtml(myClan.name)} <span class="badge badge--elder" style="margin-left:6px;">Клан</span></div>
            <div class="last">Общий чат клана</div>
          </div>
        </div>`
      : "";

    const dmRowsHtml = ids
      .map((id) => {
        const p = pMap.get(id) || { username: "Игрок" };
        const last = peers.get(id);
        return `
        <div class="conv-row" data-peer="${id}">
          <img src="${p.avatar_url || defaultAvatar(p.username)}" alt="">
          <div>
            <div>${escapeHtml(p.username)}</div>
            <div class="last">${escapeHtml((last.content || "").slice(0, 40))}</div>
          </div>
        </div>`;
      })
      .join("");

    host.innerHTML = clanRowHtml + dmRowsHtml || `<div class="empty-state">Переписок пока нет</div>`;

    const clanRow = host.querySelector("[data-clan]");
    if (clanRow) clanRow.addEventListener("click", openClanChat);
    host.querySelectorAll("[data-peer]").forEach((row) =>
      row.addEventListener("click", () => openConversation(row.dataset.peer))
    );
    highlightActiveRow();
  }

  function highlightActiveRow() {
    document.querySelectorAll(".conv-row").forEach((r) => {
      const isActive = mode === "clan" ? r.hasAttribute("data-clan") : r.dataset.peer === peer?.id;
      r.classList.toggle("is-active", isActive);
    });
  }

  function teardownLive() {
    if (channel) { sb.removeChannel(channel); channel = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    seenIds = new Set();
  }

  async function openClanChat() {
    if (!myClan) return;
    teardownLive();
    mode = "clan";
    peer = null;
    document.getElementById("no-chat").style.display = "none";
    document.getElementById("chat-shell").style.display = "flex";
    document.getElementById("peer-avatar").src = myClan.badge_url || defaultAvatar(myClan.tag);
    document.getElementById("peer-name").textContent = `${myClan.name} · общий чат`;
    document.getElementById("dm-input").placeholder = "Написать совету клана…";
    highlightActiveRow();

    const { data: msgs } = await sb
      .from("clan_messages")
      .select("*, profiles:profile_id (username, avatar_url)")
      .eq("clan_id", myClan.id)
      .order("created_at", { ascending: true })
      .limit(200);
    const log = document.getElementById("dm-log");
    log.innerHTML = (msgs || []).map((m) => renderDm(m, m.profiles)).join("");
    (msgs || []).forEach((m) => seenIds.add(m.id));
    log.scrollTop = log.scrollHeight;

    channel = sb
      .channel(`msgs-clan-${myClan.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "clan_messages", filter: `clan_id=eq.${myClan.id}` }, async (payload) => {
        if (seenIds.has(payload.new.id)) return;
        const { data: p } = await sb.from("profiles").select("username, avatar_url").eq("id", payload.new.profile_id).single();
        appendClanMsg(payload.new, p);
      })
      .subscribe();

    pollTimer = setInterval(async () => {
      const { data } = await sb
        .from("clan_messages")
        .select("*, profiles:profile_id (username, avatar_url)")
        .eq("clan_id", myClan.id)
        .order("created_at", { ascending: false })
        .limit(30);
      (data || []).slice().reverse().forEach((m) => appendClanMsg(m, m.profiles));
    }, 4000);
  }

  function appendClanMsg(m, p) {
    if (seenIds.has(m.id)) return;
    seenIds.add(m.id);
    const log = document.getElementById("dm-log");
    log.insertAdjacentHTML("beforeend", renderDm(m, p));
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("player-search").addEventListener("input", debounce(async (e) => {
    const q = e.target.value.trim();
    const host = document.getElementById("search-results");
    if (q.length < 2) { host.innerHTML = ""; return; }
    const { data } = await sb.from("profiles").select("id, username, avatar_url").ilike("username", `%${q}%`).neq("id", profile.id).limit(6);
    host.innerHTML = (data || [])
      .map(
        (p) => `<div class="conv-row" data-peer="${p.id}"><img src="${p.avatar_url || defaultAvatar(p.username)}"><div>${escapeHtml(p.username)}</div></div>`
      )
      .join("");
    host.querySelectorAll("[data-peer]").forEach((row) => row.addEventListener("click", () => openConversation(row.dataset.peer)));
  }, 300));

  async function openConversation(peerId) {
    const { data: p } = await sb.from("profiles").select("*").eq("id", peerId).single();
    if (!p) return;
    teardownLive();
    mode = "dm";
    peer = p;
    document.getElementById("no-chat").style.display = "none";
    document.getElementById("chat-shell").style.display = "flex";
    document.getElementById("peer-avatar").src = p.avatar_url || defaultAvatar(p.username);
    document.getElementById("peer-name").textContent = p.username;
    document.getElementById("dm-input").placeholder = "Написать сообщение…";
    highlightActiveRow();

    const { data: msgs } = await sb
      .from("direct_messages")
      .select("*")
      .or(`and(sender_id.eq.${profile.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${profile.id})`)
      .order("created_at", { ascending: true });

    const log = document.getElementById("dm-log");
    log.innerHTML = (msgs || []).map((m) => renderDm(m)).join("");
    (msgs || []).forEach((m) => seenIds.add(m.id));
    log.scrollTop = log.scrollHeight;

    channel = sb
      .channel(`dm-${[profile.id, peerId].sort().join("-")}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "direct_messages" }, (payload) => {
        const m = payload.new;
        const belongs = (m.sender_id === profile.id && m.receiver_id === peerId) || (m.sender_id === peerId && m.receiver_id === profile.id);
        if (!belongs || seenIds.has(m.id)) return;
        seenIds.add(m.id);
        const log = document.getElementById("dm-log");
        log.insertAdjacentHTML("beforeend", renderDm(m));
        log.scrollTop = log.scrollHeight;
        if (m.sender_id === peerId) loadConversations();
      })
      .subscribe();

    pollTimer = setInterval(async () => {
      const { data } = await sb
        .from("direct_messages")
        .select("*")
        .or(`and(sender_id.eq.${profile.id},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${profile.id})`)
        .order("created_at", { ascending: false })
        .limit(30);
      (data || []).slice().reverse().forEach((m) => {
        if (seenIds.has(m.id)) return;
        seenIds.add(m.id);
        const log = document.getElementById("dm-log");
        log.insertAdjacentHTML("beforeend", renderDm(m));
        log.scrollTop = log.scrollHeight;
      });
    }, 4000);
  }

  function renderDm(m, senderProfileOverride) {
    const mine = m.sender_id ? m.sender_id === profile.id : m.profile_id === profile.id;
    const authorId = m.sender_id || m.profile_id;
    const p = mine ? profile : senderProfileOverride || peer;
    return `
      <div class="msg ${mine ? "msg--mine" : ""}">
        <img src="${p?.avatar_url || defaultAvatar(p?.username)}" alt="">
        <div>
          <div class="meta">${!mine && mode === "clan" ? `<span>${escapeHtml(p?.username || "Игрок")}</span>` : ""}<span>${fmtTime(m.created_at)}</span></div>
          <div class="bubble">${escapeHtml(m.content)}</div>
        </div>
      </div>`;
  }

  document.getElementById("dm-composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("dm-input");
    const content = input.value.trim();
    if (!content) return;
    input.value = "";

    if (mode === "clan" && myClan) {
      const { data, error } = await sb
        .from("clan_messages")
        .insert({ clan_id: myClan.id, profile_id: profile.id, content })
        .select("*, profiles:profile_id (username, avatar_url)")
        .single();
      if (error) { toast(error.message, "error"); return; }
      appendClanMsg(data, data.profiles);
      return;
    }

    if (!peer) return;
    const { data, error } = await sb
      .from("direct_messages")
      .insert({ sender_id: profile.id, receiver_id: peer.id, content })
      .select()
      .single();
    if (error) { toast(error.message, "error"); return; }
    seenIds.add(data.id);
    const log = document.getElementById("dm-log");
    log.insertAdjacentHTML("beforeend", renderDm(data));
    log.scrollTop = log.scrollHeight;
    loadConversations();
  });

  init();
</script>
</body>
</html>
